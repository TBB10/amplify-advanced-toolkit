<!-- title: Quicklinks Template Colors -->
<!-- param: cardbg type=color label="Card background" default="" detect=".amplify-quicklinks-container .quicklinks-container article a|background-color" -->
<!-- param: cardhover type=color label="Card hover background" default="" -->
<!-- param: iconbg type=color label="Icon circle" default="" detect=".amplify-quicklinks-container article .icon|background-color" -->
<!-- param: icon type=color label="Icon" default="" detect=".amplify-quicklinks-container article .icon|color" -->
<!-- param: text type=color label="Label text" default="" detect=".amplify-quicklinks-container .quicklink-heading|color" -->
<style>
  /*
   * Overrides the site's Quicklinks block, which uses !important, so every
   * selector is prefixed with a second class for higher specificity.
   * A blank value makes the declaration invalid, so it is ignored and the
   * site's own styling stays.
   */
  .amplify-section-container.amplify-quicklinks-container .quicklinks-container article a:not(:hover):not(:focus-visible):not(:active) {
    background: {{cardbg}} !important;
  }
  .amplify-section-container.amplify-quicklinks-container .quicklinks-container article a:hover,
  .amplify-section-container.amplify-quicklinks-container .quicklinks-container article a:focus-visible,
  .amplify-section-container.amplify-quicklinks-container .quicklinks-container article a:active {
    background: {{cardhover}} !important;
  }
  .amplify-section-container.amplify-quicklinks-container article .icon {
    background: {{iconbg}} !important;
  }
  .amplify-section-container.amplify-quicklinks-container article .icon > *,
  .amplify-section-container.amplify-quicklinks-container article .icon svg,
  .amplify-section-container.amplify-quicklinks-container article .icon i {
    color: {{icon}} !important;
  }
  .amplify-section-container.amplify-quicklinks-container article .icon svg,
  .amplify-section-container.amplify-quicklinks-container article .icon svg * {
    fill: {{icon}} !important;
  }
  .amplify-section-container.amplify-quicklinks-container .container header .quicklink-heading,
  .amplify-section-container.amplify-quicklinks-container .quicklinks-container article a:hover .quicklink-heading,
  .amplify-section-container.amplify-quicklinks-container .quicklinks-container article a:focus-visible .quicklink-heading {
    color: {{text}} !important;
  }
</style>
