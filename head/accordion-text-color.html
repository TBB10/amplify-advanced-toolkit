<!-- title: Accordion Text Color (site-wide — test all color schemes) -->
<!-- param: color type=color label="Text color — applies to ALL accordions site-wide" default=#ffffff -->
<style>
/*
 * NOTE: This applies to EVERY accordion on the site, site-wide — it is not
 * scoped to one accordion instance or one color scheme. Test it against
 * every accordion color-scheme variant in use before relying on it, since
 * a text color that works on one scheme may be unreadable on another.
 */
/* Accordion headers and freeform content inside accordions */
.accordion-section .accordion-header,
.accordion-section .accordion-header *,
.accordion-section .accordion-content .amplify-freeform-rendered,
.accordion-section .accordion-content .amplify-freeform-rendered * {
  color: {{color}} !important;
}

/* Keep links identifiable without relying on color */
.accordion-section .accordion-content .amplify-freeform-rendered a {
  text-decoration: underline;
}
</style>
